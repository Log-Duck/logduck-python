name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor declared in pyproject. Testing it explicitly is what
        # catches a `X | None` or a match statement slipping into the source.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -e ".[dev]"
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          # mypy is configured for python_version 3.9; the interpreter it runs
          # on only needs to be new enough to run mypy itself.
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
